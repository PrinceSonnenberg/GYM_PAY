
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GymPay</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Righteous&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    // GymPay Bold/Energetic Theme
                    "primary": "var(--theme-primary, #FF4713)",
                    "primary-hover": "var(--theme-primary-hover, #E63C0C)",
                    "primary-soft": "var(--theme-primary-soft, #FFEAE0)",
                    "volt": "var(--theme-volt, #C8FF3D)",
                    "volt-soft": "var(--theme-volt-soft, #F3FFDA)",
                    "signal": "var(--theme-signal, #17C974)",
                    "signal-soft": "var(--theme-signal-soft, #E4FBEF)",
                    "danger": "var(--theme-danger, #FF3B5C)",
                    "danger-soft": "var(--theme-danger-soft, #FFE7EA)",
                    "ink": "var(--theme-ink, #14161F)",
                    "background": "var(--theme-background, #F1F3F0)",
                    "surface": "var(--theme-surface, #ffffff)",
                    "text-main": "var(--theme-text-main, #14161F)",
                    "text-muted": "var(--theme-text-muted, #6B7280)",
                    "border-light": "var(--theme-border-light, #E4E7E2)",
                },
                fontFamily: {
                    "display": ["var(--theme-font-display, Anton)", "sans-serif"],
                    "inter": ["var(--theme-font-inter, Inter)", "sans-serif"],
                    "mono": ["var(--theme-font-mono, 'JetBrains Mono')", "monospace"],
                },
                boxShadow: {
                    'soft': '0 2px 15px -3px rgba(20, 22, 31, 0.06), 0 4px 6px -4px rgba(20, 22, 31, 0.05)',
                    'card': '0 1px 3px 0 rgba(20, 22, 31, 0.06), 0 1px 2px -1px rgba(20, 22, 31, 0.05)',
                    'pop': '0 6px 0 0 #14161F',
                }
            },
        },
    }
    </script>
    <style>
        body {
            font-family: var(--theme-font-inter, 'Inter'), sans-serif;
        }
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 500,
          'GRAD' 0,
          'opsz' 24
        }
        /* Signature motif: clipped-corner "plate" card, reused across the app */
        .plate {
          clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
        }
        .plate-sm {
          clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
        }
        .stripe-tick {
          background-image: repeating-linear-gradient(-45deg, currentColor 0, currentColor 2px, transparent 2px, transparent 8px);
        }

        @media print {
          body * {
            visibility: hidden;
          }
          #printable-invoice, #printable-invoice * {
            visibility: visible;
          }
          #printable-invoice {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            margin: 0;
            padding: 20px !important;
            box-shadow: none !important;
            border: none !important;
          }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-background">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
